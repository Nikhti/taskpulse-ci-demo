name: TaskPulse CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/nikhti/taskpulse-ci-demo
  APP_PORT: "8000"

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: flake8 src tests --max-line-length=99

      - name: Run black check
        run: black --check src tests

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: linting
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: linting
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bandit
        run: bandit -r src

  docker-build:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest
    needs: [unit-tests, security-scan]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f artifacts/Dockerfile -t taskpulse-ci-demo:${{ github.sha }} .

      - name: Run application container
        run: |
          docker run -d --name taskpulse-smoke -p ${{ env.APP_PORT }}:8000 taskpulse-ci-demo:${{ github.sha }}
          sleep 5

      - name: Check health endpoint
        run: curl --fail http://localhost:${{ env.APP_PORT }}/health

      - name: Stop smoke container
        if: always()
        run: docker rm -f taskpulse-smoke || true

  publish-image:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tag
        id: meta
        run: echo "image-tag=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          docker build -f artifacts/Dockerfile -t ${{ steps.meta.outputs.image-tag }} -t ${IMAGE_NAME}:latest .
          docker push ${{ steps.meta.outputs.image-tag }}
          docker push ${IMAGE_NAME}:latest

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: publish-image
    if: vars.ENABLE_DEPLOY == 'true'
    environment:
      name: staging
      url: http://${{ secrets.STAGING_HOST }}:8000
    steps:
      - name: Deploy image on staging host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker pull ${{ needs.publish-image.outputs.image-tag }}
            docker rm -f taskpulse-app || true
            docker run -d --name taskpulse-app --restart unless-stopped -p 8000:8000 ${{ needs.publish-image.outputs.image-tag }}

      - name: Staging smoke check
        run: curl --fail http://${{ secrets.STAGING_HOST }}:8000/health

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [publish-image, deploy-staging]
    if: vars.ENABLE_DEPLOY == 'true'
    environment:
      name: production
      url: http://${{ secrets.PROD_HOST }}:8000
    steps:
      - name: Deploy image on production host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker pull ${{ needs.publish-image.outputs.image-tag }}
            docker rm -f taskpulse-app || true
            docker run -d --name taskpulse-app --restart unless-stopped -p 8000:8000 ${{ needs.publish-image.outputs.image-tag }}

      - name: Production health check
        run: curl --fail http://${{ secrets.PROD_HOST }}:8000/health
