name: TaskPulse Optimized CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/nikhti/taskpulse-ci-demo
  APP_PORT: "8000"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: flake8 src tests --max-line-length=99

      - name: Run black check
        run: black --check src tests

  tests:
    name: Tests (${{ matrix.test-suite }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - test-suite: domain-calculation
            pytest-filter: "calculate_completion_rate or task_status"
          - test-suite: wip-rules
            pytest-filter: "wip_limit"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest shard
        run: pytest tests -v -k "${{ matrix.pytest-filter }}"

  security-sast:
    name: Security SAST
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: bandit -r src -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  security-sca:
    name: Security SCA
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Scan Python dependencies
        run: pip-audit --requirement requirements.txt --progress-spinner off

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [security-sast, security-sca]
    steps:
      - name: Check security status
        run: |
          echo "Checking security status..."
          if [ "${{ needs.security-sast.result }}" = "failure" ] || [ "${{ needs.security-sca.result }}" = "failure" ]; then
            echo "Critical vulnerabilities found."
            exit 1
          fi
          echo "Security checks passed."

  docker-build:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest
    needs: [tests, security-gate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with BuildKit cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/Dockerfile
          push: false
          load: true
          tags: taskpulse-ci-demo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run application container
        run: |
          docker run -d --name taskpulse-smoke -p ${{ env.APP_PORT }}:8000 taskpulse-ci-demo:${{ github.sha }}
          sleep 5

      - name: Check health endpoint
        run: curl --fail http://localhost:${{ env.APP_PORT }}/health

      - name: Stop smoke container
        if: always()
        run: docker rm -f taskpulse-smoke || true

  publish-image:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tag
        id: meta
        run: echo "image-tag=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image-tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: publish-image
    if: vars.ENABLE_DEPLOY == 'true'
    environment:
      name: staging
    steps:
      - name: Deploy image on staging host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker pull ${{ needs.publish-image.outputs.image-tag }}
            docker rm -f taskpulse-app || true
            docker run -d --name taskpulse-app --restart unless-stopped -p 8000:8000 ${{ needs.publish-image.outputs.image-tag }}

      - name: Staging smoke check
        run: curl --fail http://${{ secrets.STAGING_HOST }}:8000/health

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [publish-image, deploy-staging]
    if: vars.ENABLE_DEPLOY == 'true'
    environment:
      name: production
    steps:
      - name: Deploy image on production host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker pull ${{ needs.publish-image.outputs.image-tag }}
            docker rm -f taskpulse-app || true
            docker run -d --name taskpulse-app --restart unless-stopped -p 8000:8000 ${{ needs.publish-image.outputs.image-tag }}

      - name: Production health check
        run: curl --fail http://${{ secrets.PROD_HOST }}:8000/health

