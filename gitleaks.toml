title = "TaskPulse Gitleaks Rules"

[allowlist]
description = "Ignore generated educational reports without secrets"
paths = [
  '''artifacts/.*report\.json''',
  '''artifacts/sbom\.json'''
]

[[rules]]
id = "aws-access-key"
description = "AWS access key"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["key", "aws"]

[[rules]]
id = "generic-api-key"
description = "Generic API key assignment"
regex = '''(?i)(api[_-]?key|token|secret)["'\s:=]+[A-Za-z0-9_\-]{20,}'''
tags = ["key", "generic"]

[[rules]]
id = "private-key"
description = "Private key block"
regex = '''-----BEGIN (RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY-----'''
tags = ["key", "private"]

[[rules]]
id = "password-in-code"
description = "Password value assigned in code"
regex = '''(?i)(password|passwd|pwd)["'\s:=]+["'][^"']{8,}["']'''
tags = ["password"]

[[rules]]
id = "database-url-with-password"
description = "Database URL with embedded credentials"
regex = '''(?i)(postgres|mysql|mongodb|redis):\/\/[^:\s]+:[^@\s]+@[^\s]+'''
tags = ["database", "credential"]
